[package]
name = "atcgame"
version = "0.1.0"
edition = "2024"

[dependencies]
fastrand = "2"
glam = "0.27"
macroquad = { version = "0.4", features = ["audio"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# Keep the game code quick to rebuild, but run dependencies optimised so the
# window stays smooth in debug builds.
[profile.dev.package."*"]
opt-level = 2
