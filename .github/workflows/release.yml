# Builds the game for Windows and macOS.
#
# - Push a tag like v0.2.0 to build both and publish them as a GitHub release.
# - Or run it by hand from the Actions tab ("Run workflow") with a version
#   like v0.2.0: it tags the commit it ran on and publishes the release.
#   Untick "Publish a release" to only build, and download the zips from the
#   run (the version can then be left blank).
#
# Each platform first checks that the sim matches the pinned determinism
# checksums, so co-op and shared replays work between Windows and Mac.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, such as v0.2.0 (tags the selected branch's latest commit)"
        required: false
        type: string
      publish:
        description: "Publish a release (untick to only build the zips)"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The pushed tag, or the version typed in when run by hand.
  VERSION: ${{ inputs.version || github.ref_name }}
  # A pushed tag always publishes; a manual run unless unticked.
  PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check the version
        if: env.PUBLISH == 'true'
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The version must look like v1.2.3, not '$VERSION'."
            exit 1
          fi

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: The sim matches the pinned checksums
        run: cargo test --release --locked --test determinism -- --ignored matches_the_pinned_checksums
      - name: Build
        run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          $name = "atcgame-$env:VERSION-windows-x64"
          New-Item -ItemType Directory -Force "dist/$name" | Out-Null
          Copy-Item target/release/atcgame.exe "dist/$name/Air Traffic Control.exe"
          Copy-Item README.md, DATA_NOTICE.md "dist/$name/"
          Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip

  macos:
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: The sim matches the pinned checksums (Apple Silicon and Intel)
        run: |
          cargo test --release --locked --test determinism -- --ignored matches_the_pinned_checksums
          cargo test --release --locked --target x86_64-apple-darwin --test determinism -- --ignored matches_the_pinned_checksums
      - name: Install cargo-bundle
        # --locked: a plain install fails to compile one of its dependencies.
        run: cargo install cargo-bundle --version 0.12.0 --locked
      - name: Build the app
        run: cargo bundle --release
      - name: Make it a universal binary (Apple Silicon and Intel)
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          app="target/release/bundle/osx/Air Traffic Control.app"
          lipo -create -output "$app/Contents/MacOS/atcgame" \
            target/aarch64-apple-darwin/release/atcgame \
            target/x86_64-apple-darwin/release/atcgame
          lipo -info "$app/Contents/MacOS/atcgame"
          # Apple Silicon won't run unsigned code: sign it ad hoc (no Apple
          # Developer ID, so Gatekeeper still asks the first time).
          codesign --force --deep --sign - "$app"
          codesign --verify --verbose "$app"
      - name: Package
        run: |
          name="atcgame-$VERSION-macos-universal"
          mkdir -p "dist/$name"
          cp -R "target/release/bundle/osx/Air Traffic Control.app" "dist/$name/"
          cp README.md DATA_NOTICE.md "dist/$name/"
          # ditto keeps the app's permissions and metadata intact in the zip.
          ditto -c -k --keepParent "dist/$name" "dist/$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.zip

  release:
    if: github.event_name == 'push' || inputs.publish
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Run by hand, the tag doesn't exist yet: --target makes it on the
          # commit that was built. For a pushed tag it's already there.
          gh release create "$VERSION" dist/*.zip \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Air Traffic Control $VERSION" \
            --generate-notes \
            --notes "Unzip and run. The macOS app isn't notarized: the first time, right-click it and choose Open, or on macOS 15 and later open it once, then allow it under System Settings, Privacy & Security. On Windows, SmartScreen may ask you to confirm (More info, Run anyway)."
