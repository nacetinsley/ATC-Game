# Fictional airport. Coordinates are nautical miles from the field: x east, y north.
# Arrival gates sit on the diagonals and departure exits on the cardinals, so the
# two flows only cross where the player has to manage them with altitude.

name = "Harrowgate International"
code = "XHGT"
elevation = 0.0
go_around_altitude = 3000.0
mva_default = 2000.0

# Sector boundary.
sector = [
  [20.0, 52.0], [52.0, 20.0], [52.0, -20.0], [20.0, -52.0],
  [-20.0, -52.0], [-52.0, -20.0], [-52.0, 20.0], [-20.0, 52.0],
]

[[mva]]
altitude = 5000.0
polygon = [[-52.0, 20.0], [-20.0, 52.0], [-10.0, 30.0], [-30.0, 12.0]]

[[mva]]
altitude = 4000.0
polygon = [[30.0, -8.0], [52.0, -20.0], [20.0, -52.0], [12.0, -24.0]]

